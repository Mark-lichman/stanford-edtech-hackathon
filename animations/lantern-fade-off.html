<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lantern — fades off</title>
<body style="background:#F5E9CF;color:#3A2E1F;font:14px system-ui;padding:40px">

<!-- Standalone. Copy the <style> and the <svg> below into anything: no
     dependencies, no CSS variables borrowed from pitch.html. Add the class
     "out" to play it. One flare, then nothing.

     The lantern starts lit because "both" holds the from-state; if you are
     compositing this after the glow-on, keep the same .glow/.flame markup and
     just swap the class.

     pitch.html runs this off scroll instead of a timer by adding
     `animation-timeline: view()` inside an @supports block (lines 443-449) so
     the flame goes out on beat 14's ending. Left out here on purpose — a
     standalone element should play when you tell it to. -->

<style>
  .lantern .flame,
  .lantern .glow {
    transform-box: fill-box;
    transform-origin: 50% 100%;
  }

  .lantern .glow { filter: blur(5px); opacity: 0.4; }

  @keyframes flame-out {
    from { opacity: 1; transform: scaleY(1);    fill: #E09612; }
    22%  { opacity: 1; transform: scaleY(1.18); }
    to   { opacity: 0; transform: scaleY(0.25); fill: #7A6748; }
  }

  @keyframes glow-out {
    from { opacity: 0.4;  transform: scale(1); }
    22%  { opacity: 0.62; transform: scale(1.15); }
    to   { opacity: 0;    transform: scale(0.3); }
  }

  .lantern.out .flame { animation: flame-out 520ms ease-in both; }
  .lantern.out .glow  { animation: glow-out  460ms ease-in both; }

  @media (prefers-reduced-motion: reduce) {
    .lantern .flame, .lantern .glow { animation: none; }
    .lantern.out .flame, .lantern.out .glow { opacity: 0; }
  }
</style>

<svg id="lantern" class="lantern" width="60" height="76" viewBox="0 0 66 82"
     role="img" aria-label="A small lantern, going out.">
  <path d="M26 8 h14" stroke="#3A2E1F" stroke-width="3" stroke-linecap="round"></path>
  <path d="M33 8 v9" stroke="#3A2E1F" stroke-width="3" stroke-linecap="round"></path>
  <rect x="14" y="17" width="38" height="9" rx="3" fill="#3A2E1F"></rect>
  <path d="M17 26 h32 l4 40 a4 4 0 0 1 -4 4 h-32 a4 4 0 0 1 -4 -4 z" fill="#F5E9CF" stroke="#3A2E1F" stroke-width="3"></path>
  <circle class="glow" cx="33" cy="48" r="15" fill="#E09612"></circle>
  <path class="flame" d="M33 36 c7 8 9 12 9 17 a9 9 0 0 1 -18 0 c0 -5 2 -9 9 -17 z" fill="#E09612"></path>
  <rect x="9" y="70" width="48" height="8" rx="4" fill="#3A2E1F"></rect>
</svg>

<!-- demo harness only, not part of the element -->
<p><button onclick="lantern.classList.remove('out');void lantern.offsetWidth;lantern.classList.add('out')">blow it out</button></p>
